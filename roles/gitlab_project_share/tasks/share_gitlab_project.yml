---
# gitlab_project_shares:
#   - name: project_to_share
#     group_full_path: parent/group_to_share_with
#     group_access: 30 
#     expires_at: YYYY-MM-DD
#     state: present

- name: Get GitLab group details block
  block:
    - name: GitLab | Get id of group to invite
      no_log: "{{ gitlab_project_share_secure_logging }}"
      register: __get_member_group_id_result
      ansible.builtin.uri:
        url: "{{ gitlab_api_url }}/api/v4/groups/{{ __gitlab_project_shares_item['group_full_path'] | replace('/','%2F') }}"
        validate_certs: "{{ gitlab_validate_certs | default(true) }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200]
    - name: Set group id
      ansible.builtin.set_fact:
        gitlab_member_group_id: "{{ __get_member_group_id_result['json']['id']  }}"
  rescue:
    - name: Task failed
      ansible.builtin.fail:
       msg: "{{ __get_member_group_id_result['json']['message'] }}"

- name: Get Gitlab project block
  block:
    - name: GitLab | Get project to share
      no_log: "{{ gitlab_project_share_secure_logging }}"
      register: __get_gitlab_project_details
      ansible.builtin.uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ __gitlab_project_shares_item['name'] | replace('/','%2F') }}"
        validate_certs: "{{ gitlab_validate_certs | default(true) }}"
        method: GET
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200,201,204,409] 
        body_format: json
        body:
          group_id: "{{ gitlab_member_group_id | default(__gitlab_project_shares_item['group_id']) }}"
          group_access: "{{ __gitlab_project_shares_item['group_access'] | default(30) }}"
          expires_at: "{{ __gitlab_project_shares_item['group_access'] | default('') }}"
  rescue:
    - name: Task failed
      ansible.builtin.fail:
       msg: "{{ __get_gitlab_project_details['json']['message'] }}"

- name: Share Gitlab project block
  block:
    - name: GitLab | Share project with group
      no_log: "{{ gitlab_project_share_secure_logging }}"
      when: >
        __operation['uri_method'] == "DELETE" and __gitlab_project_shares_item['group_full_path'] in __get_gitlab_project_details['json']['shared_with_groups'] | selectattr('group_full_path', 'defined') | map(attribute='group_full_path')
        or __operation['uri_method'] == "POST" and __gitlab_project_shares_item['group_full_path'] not in __get_gitlab_project_details['json']['shared_with_groups'] | selectattr('group_full_path', 'defined') | map(attribute='group_full_path')
      register: __share_gitlab_project_result
      ansible.builtin.uri:
        url: "{{ gitlab_api_url }}/api/v4/projects/{{ __gitlab_project_shares_item['name'] | replace('/','%2F') }}/share{{ (__operation['uri_method'] == 'DELETE') | ternary('/' + gitlab_member_group_id | default(__gitlab_project_shares_item['group_id']), '') }}"
        validate_certs: "{{ gitlab_validate_certs | default(true) }}"
        method: "{{ __operation['uri_method'] }}"
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        status_code: [200,201,204,409] 
        body_format: json
        body:
          group_id: "{{ gitlab_member_group_id | default(__gitlab_project_shares_item['group_id']) }}"
          group_access: "{{ gitlab_access_translate[__gitlab_group_shares_item['group_access'] | lower] | default(10) }}"
          expires_at: "{{ __gitlab_project_shares_item['group_access'] | default('') }}"
  rescue:
    - name: Task failed
      ansible.builtin.fail:
       msg: "{{ __share_gitlab_project_result['json']['message'] }}"
...